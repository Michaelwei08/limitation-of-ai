  initial_task: "Prepare a concise literature review on prompt-injection attacks against tool-using agents."
  checkpoint_state:
    task_goal: "Write a structured literature review with attack categories, representative works, and gaps."
    latest_user_intent: "Cover prompt injection in tool-using agents."
    constraints:
      - "Use verified academic or primary sources only."
      - "Keep the review under 1200 words."
    completed_steps:
      - "Grouped works into direct prompt injection, indirect prompt injection, and tool-mediated exfiltration."
      - "Identified AgentDojo and InjecAgent as reusable anchor benchmarks."
    pending_steps:
      - "Write gap synthesis."
      - "Add citation placeholders."
    assumptions:
      active:
        - "The review should focus on security evaluation rather than permission UX."
      invalidated: []
    evidence:
      reusable:
        - "AgentDojo evaluates prompt-injection attacks in tool-using agents."
        - "InjecAgent focuses on indirect prompt injection."
      affected: []
    partial_conclusions:
      reusable:
        - "Existing benchmarks expose failures but do not fully define task-scoped permission boundaries."
      needs_revision: []
    uncertainties:
      - "Whether to include browser-agent safety as its own section."
    next_action: "Draft the gap synthesis."
  mid_task_input:
    text: "Also include browser-agent safety as a distinct category."
    input_type: addition
  expected_reuse:
    - "Keep the existing prompt-injection taxonomy and anchor benchmarks."
    - "Reuse the existing gap claim after adding browser-specific scope."
  expected_invalidate:
    - "Do not treat browser-agent safety as merely a footnote."
  expected_local_replan:
    - "Insert a browser-agent category before the gap synthesis."
    - "Add one or two browser-agent sources if already verified."
  expected_final_answer_properties:
    - "Contains a distinct browser-agent safety subsection."
    - "Preserves verified-source caution."
  forbidden_behavior:
    - "Restart the entire review from scratch."
    - "Invent unverified browser-agent citations."
